# DAHPadRouter settings - keep this file next to the game exe (DH-Win64-Shipping.exe)

# 1 = on, 0 = off (Ctrl+Shift+O also toggles in-game)
Enabled=1

# XInput slot of Player 2's pad. 0 = first pad (Player 1), 1 = second pad.
HidePadIndex=1

# How pad 2 reaches Player 2:
#   1 = straight into Player 2's PlayerInput (recommended; bypasses the game's routing)
#   0 = through the game viewport as controller P2ControllerId (the old way)
Mode=1

# PlayerInput slots, found by the PlayerInput probe (Ctrl+Shift+I in-game, with a save loaded).
# 71 for the Steam/PC version. The axis slot can stay 0: sticks and triggers then go
# through the key slot. If the key slot is 0, the second pad is only hidden.
PlayerInputKeySlot=71
PlayerInputAxisSlot=0

# --- Viewport mode (Mode=0) only ---
# Unreal ControllerId of Player 2. DAH2P creates Player 2 with 1.
P2ControllerId=1

# Viewport slots, found by Ctrl+Shift+P; 9 and 10 for the Steam/PC version.
InputKeySlot=9
InputAxisSlot=10

# Advanced - leave alone unless told otherwise.
ViewportClientOffset=0
ViewportPtrOffset=0x98

# --- Split-screen aim (needs the DLL with the aim fix) ---
# 1 = each player aims at the middle of their own half, 0 = stock game aim.
AimFix=1
# Where each player aims, as a fraction of the whole screen width, measured from the left
# edge of that player's own half. 0.25 = middle of a half. Saved changes apply in-game.
AimP1X=0.25
AimP2X=0.25
# Top/bottom split only: extra height (fraction of the screen) added to each player's aim point.
AimP1Y0=0
AimP2Y0=0

# 1 = when the game code works on Player 2's things and asks for "the player", it gets
# Player 2 (lock-on, aiming, pickups, HUD). 0 = off. Saved changes apply in-game.
PlayerContext=1

# 1 = also use "whose event/script is running" (ProcessEvent hook) to tell the players apart.
# Off for now: hooking it crashed the game once at start-up.
ScriptContext=0

# Test (set by Claude): these places always get Player 1
ForceP1Sites=0x960E52
