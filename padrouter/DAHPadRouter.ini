# DAHPadRouter settings - keep this file next to the game exe (DH-Win64-Shipping.exe)

# 1 = on, 0 = off (Ctrl+Shift+O also toggles in-game)
Enabled=1

# XInput slot of Player 2's pad. 0 = first pad (Player 1), 1 = second pad.
HidePadIndex=1

# How pad 2 reaches Player 2:
#   1 = straight into Player 2's PlayerInput (recommended; bypasses the game's routing)
#   0 = through the game viewport as controller P2ControllerId (the old way)
Mode=1

# PlayerInput slots, found by the PlayerInput probe (Ctrl+Shift+I in-game, with a save loaded).
# 71 for the Steam/PC version. The axis slot can stay 0: sticks and triggers then go
# through the key slot. If the key slot is 0, the second pad is only hidden.
PlayerInputKeySlot=71
PlayerInputAxisSlot=0

# --- Viewport mode (Mode=0) only ---
# Unreal ControllerId of Player 2. DAH2P creates Player 2 with 1.
P2ControllerId=1

# Viewport slots, found by Ctrl+Shift+P; 9 and 10 for the Steam/PC version.
InputKeySlot=9
InputAxisSlot=10

# Advanced - leave alone unless told otherwise.
ViewportClientOffset=0
ViewportPtrOffset=0x98
